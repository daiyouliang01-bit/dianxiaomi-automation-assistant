<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; padding: 15px; font-family: sans-serif; background: #f9f9f9; }
    h3 { margin: 0 0 15px 0; font-size: 16px; color: #333; }

    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      background: #1890ff; color: white;
    }
    .btn:hover { background: #40a9ff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .btn-save { background: #52c41a; margin-top: 5px; }
    .btn-save:hover { background: #73d13d; }

    #status { margin-top: 15px; font-size: 12px; color: #666; padding: 10px; background: white; border-radius: 4px; border: 1px solid #eee; min-height: 40px; }
    .success { color: #52c41a; font-weight: bold; }
    .error { color: #ff4d4f; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; color: #888; }
    
    .divider { height: 1px; background: #ddd; margin: 15px 0; }
    
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; color: #333; margin-bottom: 5px; font-weight: bold;}
    .input-group input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .input-group textarea { width: 100%; min-height: 58px; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-family: inherit; resize: vertical; }
    .hint { margin: -4px 0 8px; color: #888; font-size: 11px; line-height: 1.45; }
    .brand-title { margin: 10px 0 5px; color: #555; font-size: 12px; font-weight: bold; }
    .brand-tags { display: flex; flex-wrap: wrap; gap: 5px; max-height: 116px; overflow-y: auto; padding: 2px; }
    .brand-tag { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 4px 6px; color: #135200; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 4px; font-size: 11px; }
    .brand-tag.readonly { color: #1d39c4; background: #f0f5ff; border-color: #adc6ff; }
    .brand-tag button { width: 14px; height: 14px; padding: 0; color: #389e0d; border: 0; background: transparent; cursor: pointer; font-size: 14px; line-height: 12px; }
    .brand-tag button:hover { color: #cf1322; }
    .empty-brand { color: #aaa; font-size: 11px; padding: 3px 0; }
    .brand-message { min-height: 17px; margin-top: 6px; font-size: 11px; line-height: 1.35; }
    .brand-message.success { color: #389e0d; }
    .brand-message.warning { color: #d46b08; }
    details { margin-top: 10px; }
    details summary { color: #555; cursor: pointer; font-size: 12px; font-weight: bold; }
    details input { width: 100%; box-sizing: border-box; margin: 8px 0 5px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h3>🛡️ 违禁词管家</h3>

  <div class="info-row">
    <span>当前本地库:</span>
    <span id="currentCount">0</span>
  </div>

  <button id="syncBtn" class="btn">🔄 同步店小秘词库</button>

  <div class="divider"></div>

  <h3>✨ Gemini 优化配置</h3>
  <div class="input-group">
    <label for="geminiKey">Gemini API Key:</label>
    <input type="password" id="geminiKey" placeholder="在此输入您的 API Key" />
  </div>
  <button id="saveKeyBtn" class="btn btn-save">💾 保存 Key</button>

  <div class="divider"></div>

  <h3>🤖 千问 产品编码优化</h3>
  <div class="input-group">
    <label for="qwenKey">通义千问 API Key:</label>
    <input type="password" id="qwenKey" placeholder="在此输入 DashScope API Key" />
  </div>
  <button id="saveQwenKeyBtn" class="btn btn-save" style="background:#722ed1;">💾 保存千问 Key</button>

  <div id="status">准备就绪。</div>
  <script src="src/popup/popup.js"></script>
</body>
</html>
